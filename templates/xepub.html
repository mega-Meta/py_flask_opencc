<!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <title>ePub 簡轉繁工具</title>
            <style>
                body { font-family: -apple-system, sans-serif; text-align: center; padding-top: 50px; background: #f5f5f7; }
                .container { background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
                input[type="file"] { margin: 20px 0; }
                input[type="submit"] { background: #0071e3; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
                input[type="submit"]:hover { background: #0077ed; }
            </style>
        </head>
        <body>
            <div class="container">
                <h2>ePub 電子書簡轉繁 (OpenCC)</h2>
                <form action="/epub" method="POST" enctype="multipart/form-data">
                    <input type="file" name="epub_file" accept=".epub" required><br>
                    <input type="submit" value="開始轉換並下載">
                </form>
            </div>
        </body>
        </html>
